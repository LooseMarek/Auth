name: Build and Test SPM (macOS)

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
  pull_request:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test (macOS)
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests via Fastlane
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "5"
        run: bundle exec fastlane mac test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: snapshot-failures-macos-${{ github.run_id }}
          path: fastlane/test_output/
          retention-days: 14
