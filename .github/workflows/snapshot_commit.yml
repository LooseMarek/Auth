name: Commit Snapshots

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform(s) to record and commit'
        required: true
        default: 'both'
        type: choice
        options:
          - ios
          - macos
          - both

jobs:
  commit:
    name: Commit Snapshots (${{ inputs.platform }})
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Delete stale x86_64 snapshots
        run: find . -not -path './.build/*' -type f -name '*-x86_64.png' -path '*/__Snapshots__/*' -delete

      - name: Record iOS snapshots
        if: inputs.platform == 'ios' || inputs.platform == 'both'
        continue-on-error: true
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "5"
          SNAPSHOT_TESTING_RECORD: "all"
        run: bundle exec fastlane ios record_snapshots

      - name: Record macOS snapshots
        if: inputs.platform == 'macos' || inputs.platform == 'both'
        continue-on-error: true
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "5"
          SNAPSHOT_TESTING_RECORD: "all"
        run: bundle exec fastlane mac record_snapshots

      - name: Commit and push snapshots
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          X86_SNAPSHOTS=$(find . -not -path './.build/*' -type f -name '*-x86_64.png' -path '*/__Snapshots__/*')
          if [ -z "$X86_SNAPSHOTS" ]; then
            echo "No x86_64 snapshot files found — recording may have failed"
            exit 1
          fi

          echo "$X86_SNAPSHOTS" | xargs git add
          git ls-files --deleted Tests/ | grep -- '-x86_64\.png$' | xargs -r git rm

          if git diff --staged --quiet; then
            echo "x86_64 snapshots unchanged — no commit needed"
          else
            git commit -m "chore: update CI-generated snapshots (x86_64) [${{ inputs.platform }}] on ${{ github.ref_name }}"
            git push
          fi
