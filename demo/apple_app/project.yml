name: DemoAuth
options:
  bundleIdPrefix: com.marekloose
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

packages:
  Auth:
    path: ../..

targets:
  DemoAuthDefault:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: ["DemoAuth"]
    dependencies:
      - package: Auth
        product: AuthClient
    configFiles:
      Debug: GoogleCredentials.xcconfig
      Release: GoogleCredentials.xcconfig
    settings:
      base:
        SWIFT_VERSION: 6.2
        PRODUCT_BUNDLE_IDENTIFIER: com.marekloose.demoauth.default
        DEVELOPMENT_TEAM: 9JVYUSJU3D
        EXCLUDED_SOURCE_FILE_NAMES: "DemoAuthApp.swift DemoAuthCustomApp.swift"
        CODE_SIGN_ENTITLEMENTS: "DemoAuth/DemoAuth.entitlements"
        INFOPLIST_FILE: "DemoAuth/Info.plist"

  DemoAuthDefaultTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: ["DemoAuthDefaultTests"]
    dependencies:
      - target: DemoAuthDefault
    settings:
      base:
        SWIFT_VERSION: 6.2
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        DEVELOPMENT_TEAM: ""

  DemoAuthCustom:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: "DemoAuth"
        excludes:
          - "Resources"
      - path: "DemoAuth/Resources"
        type: resource
    dependencies:
      - package: Auth
        product: AuthClient
    configFiles:
      Debug: GoogleCredentials.xcconfig
      Release: GoogleCredentials.xcconfig
    settings:
      base:
        SWIFT_VERSION: 6.2
        PRODUCT_BUNDLE_IDENTIFIER: com.marekloose.demoauth.custom
        DEVELOPMENT_TEAM: 9JVYUSJU3D
        EXCLUDED_SOURCE_FILE_NAMES: "DemoAuthApp.swift DemoAuthDefaultApp.swift"
        CODE_SIGN_ENTITLEMENTS: "DemoAuth/DemoAuth.entitlements"
        INFOPLIST_FILE: "DemoAuth/Info.plist"

  DemoAuthCustomTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: ["DemoAuthCustomTests"]
    dependencies:
      - target: DemoAuthCustom
    settings:
      base:
        SWIFT_VERSION: 6.2
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        DEVELOPMENT_TEAM: ""

  DemoAuthmacOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources: ["DemoAuth"]
    dependencies:
      - package: Auth
        product: AuthClient
    configFiles:
      Debug: GoogleCredentials.xcconfig
      Release: GoogleCredentials.xcconfig
    settings:
      base:
        SWIFT_VERSION: 6.2
        PRODUCT_BUNDLE_IDENTIFIER: com.marekloose.DemoAuth-macos
        DEVELOPMENT_TEAM: 9JVYUSJU3D
        EXCLUDED_SOURCE_FILE_NAMES: "DemoAuthDefaultApp.swift DemoAuthCustomApp.swift"
        INFOPLIST_FILE: "DemoAuth/Info.plist"

  DemoAuthmacOSTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources: ["DemoAuthmacOSTests"]
    dependencies:
      - target: DemoAuthmacOS
    settings:
      base:
        SWIFT_VERSION: 6.2
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        DEVELOPMENT_TEAM: ""

schemes:
  DemoAuthDefault:
    build:
      targets:
        DemoAuthDefault: all
    test:
      targets:
        - DemoAuthDefaultTests
    run:
      config: Debug
    archive:
      config: Release
  DemoAuthCustom:
    build:
      targets:
        DemoAuthCustom: all
    test:
      targets:
        - DemoAuthCustomTests
    run:
      config: Debug
    archive:
      config: Release
  DemoAuthmacOS:
    build:
      targets:
        DemoAuthmacOS: all
    test:
      targets:
        - DemoAuthmacOSTests
    run:
      config: Debug
    archive:
      config: Release
