name: DemoAuth
options:
  bundleIdPrefix: com.marekloose
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"


targets:
  DemoAuth:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: ["DemoAuth"]
    info:
      path: "DemoAuth/Info.plist"
      properties:
        UILaunchScreen: {}
    settings:
      base:
        SWIFT_VERSION: 6.2
        PRODUCT_BUNDLE_IDENTIFIER: com.marekloose.DemoAuth
        DEVELOPMENT_TEAM: XXXXXXXXXX

  DemoAuthTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: ["DemoAuthTests"]
    dependencies:
      - target: DemoAuth
    settings:
      base:
        SWIFT_VERSION: 6.2
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        DEVELOPMENT_TEAM: ""

  DemoAuthmacOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources: ["DemoAuth"]
    info:
      path: "DemoAuth/Info.plist"
      properties: {}
    settings:
      base:
        SWIFT_VERSION: 6.2
        PRODUCT_BUNDLE_IDENTIFIER: com.marekloose.DemoAuth-macos
        DEVELOPMENT_TEAM: XXXXXXXXXX

  DemoAuthmacOSTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources: ["DemoAuthmacOSTests"]
    dependencies:
      - target: DemoAuthmacOS
    settings:
      base:
        SWIFT_VERSION: 6.2
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        DEVELOPMENT_TEAM: ""




schemes:
  DemoAuth:
    build:
      targets:
        DemoAuth: all
    test:
      targets:
        - DemoAuthTests
    run:
      config: Debug
    archive:
      config: Release
  DemoAuthmacOS:
    build:
      targets:
        DemoAuthmacOS: all
    test:
      targets:
        - DemoAuthmacOSTests
    run:
      config: Debug
    archive:
      config: Release
